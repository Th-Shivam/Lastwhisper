name: Bug report
description: Report a reproducible LastWhisper defect using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private audio, transcripts, databases, notes, credentials, or model tokens.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps using synthetic or non-sensitive data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options: [Native CPU, Native CUDA, Docker CPU, Other]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, model names, device, and compute type. Remove private paths.
    validations:
      required: true
